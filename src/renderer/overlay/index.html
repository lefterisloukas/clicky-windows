<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Clicky Overlay</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    /* Response caption — the streaming "Companion Pill". One block, anchored
       ONCE per reply at the user's cursor, streaming the model's full answer
       letter-by-letter. It never relocates or re-segments while the voice plays
       (that decoupling is what keeps text and speech from desyncing). */
    #response {
      position: absolute;
      max-width: 260px;
      padding: 9px 13px;
      border-radius: 13px;
      background: rgba(13, 18, 28, 0.92);
      border: 1px solid rgba(34, 211, 238, 0.35);
      color: #F1F6FB;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 13.5px;
      line-height: 1.4;
      font-weight: 480;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(3px);
      transform-origin: top left;
      opacity: 0;
      transform: scale(0.82);
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.2, 1.3, 0.4, 1),
                  left 0.15s ease-out, top 0.15s ease-out;
      pointer-events: none;
      overflow-wrap: break-word;
      z-index: 9997;
    }

    #response.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Tail — a rotated square pointing back toward the anchor. The side it sits
       on flips with placement via the data-tail / data-tailx attributes. */
    #response::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(13, 18, 28, 0.92);
      border-left: 1px solid rgba(34, 211, 238, 0.35);
      border-top: 1px solid rgba(34, 211, 238, 0.35);
      transform: rotate(45deg);
    }
    #response[data-tail="top"]::before    { top: -6px;    left: 16px; }
    #response[data-tail="bottom"]::before { bottom: -6px; left: 16px; transform: rotate(225deg); }
    #response[data-tailx="right"][data-tail="top"]::before    { right: 16px; left: auto; transform: rotate(45deg) scaleX(-1); }
    #response[data-tailx="right"][data-tail="bottom"]::before { right: 16px; left: auto; transform: rotate(225deg) scaleX(-1); }

    #response .cap-body { display: inline; }

    #response .cap-caret {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      vertical-align: -2px;
      margin-left: 1px;
      background: #22D3EE;
      border-radius: 1px;
      box-shadow: 0 0 6px #22D3EE;
      animation: capBlink 1s steps(1) infinite;
    }

    @keyframes capBlink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      #response { transition: opacity 0.2s ease; transform: scale(1); }
      #response .cap-caret { animation: none; }
    }

    /* Numbered constellation — one persistent badge per point. All badges show
       together (a quick cascade entrance, NOT a voice-paced walk); a single
       pointer is a plain dot, two or more are numbered. Each carries a short
       label chip. They linger past the voice, then fade together with the pill. */
    #badges {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 9996;
    }
    .badge {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: rgba(59, 130, 246, 0.96);
      box-shadow: 0 0 22px rgba(59, 130, 246, 0.85), 0 0 0 3px rgba(255, 255, 255, 0.9);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 1.3, 0.4, 1),
                  left 0.4s ease-out, top 0.4s ease-out;
    }
    .badge.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .badge::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.4);
      animation: pulse 1.6s ease-in-out infinite;
      z-index: -1;
    }

    .chip {
      position: absolute;
      transform: translate(-50%, 16px);
      background: rgba(0, 0, 0, 0.82);
      color: #fff;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, left 0.4s ease-out, top 0.4s ease-out;
      z-index: 9995;
    }
    .chip.show { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .badge {
        transition: opacity 0.3s ease, left 0.4s ease-out, top 0.4s ease-out;
        transform: translate(-50%, -50%) scale(1);
      }
      .badge.show { transform: translate(-50%, -50%) scale(1); }
      .badge::after { animation: none; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(2); opacity: 0; }
    }

    /* Cursor buddy — 4-pointed spark that follows the cursor, anchored
       bottom-right of the cursor tip so it never covers the hotspot. */
    #cursor-buddy {
      position: absolute;
      width: 14px;
      height: 14px;
      transform: translate(8px, 8px);
      pointer-events: none;
      z-index: 9998;
      opacity: 0;
      transition: opacity 0.3s ease;
      animation: sparkSpin 7s linear infinite, sparkPulse 2s ease-in-out infinite;
    }

    #cursor-buddy.visible {
      opacity: 0.82;
    }

    @keyframes sparkSpin {
      to { transform: translate(8px, 8px) rotate(360deg); }
    }

    @keyframes sparkPulse {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.8)) drop-shadow(0 0 8px rgba(34, 211, 238, 0.3)); }
      50%       { filter: drop-shadow(0 0 7px rgba(34, 211, 238, 1.0)) drop-shadow(0 0 14px rgba(34, 211, 238, 0.5)); }
    }

    @media (prefers-reduced-motion: reduce) {
      #cursor-buddy { animation: none; transform: translate(8px, 8px); }
    }

    /* Cursor companion — bare animation anchored bottom-right of cursor tip. */
    #companion {
      --c: #22D3EE;
      position: absolute;
      left: 0;
      top: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translate(14px, 14px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 10000;
    }

    #companion.visible { opacity: 0.72; }
    #companion[data-state="listening"] { --c: #22D3EE; }
    #companion[data-state="thinking"]  { --c: #3B82F6; }

    /* Listening: 5 equalizer bars */
    #eq-bars {
      display: none;
      align-items: center;
      gap: 2.5px;
      height: 22px;
    }
    #eq-bars .bar {
      width: 3px;
      border-radius: 2px;
      background: var(--c);
      box-shadow: 0 0 7px rgba(34, 211, 238, 0.8);
      animation: barDance 1s ease-in-out infinite;
    }
    #eq-bars .bar:nth-child(1) { --bh: 7px;  animation-delay: 0s; }
    #eq-bars .bar:nth-child(2) { --bh: 14px; animation-delay: 0.11s; }
    #eq-bars .bar:nth-child(3) { --bh: 20px; animation-delay: 0.22s; }
    #eq-bars .bar:nth-child(4) { --bh: 14px; animation-delay: 0.33s; }
    #eq-bars .bar:nth-child(5) { --bh: 7px;  animation-delay: 0.44s; }

    @keyframes barDance {
      0%, 100% { height: calc(var(--bh) * 0.35); }
      50%       { height: var(--bh); }
    }

    /* Thinking: conic-gradient ring spinner */
    #companion .mini-spin {
      display: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, var(--c) 300deg, transparent 360deg);
      -webkit-mask: radial-gradient(circle 5px at center, transparent 96%, #000 100%);
              mask: radial-gradient(circle 5px at center, transparent 96%, #000 100%);
      animation: spin 1.35s linear infinite;
      filter: drop-shadow(0 0 5px var(--c));
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #companion[data-state="listening"] #eq-bars    { display: flex; }
    #companion[data-state="thinking"]  .mini-spin  { display: block; }

    @media (prefers-reduced-motion: reduce) {
      #companion .mini-spin { animation: none; }
      #eq-bars .bar { animation: none; height: var(--bh); }
    }
  </style>
</head>
<body>
  <svg id="cursor-buddy" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="spark-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="35%"  stop-color="#22D3EE" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.3"/>
      </radialGradient>
    </defs>
    <!-- 4-pointed star: two overlapping diamond shapes -->
    <path d="M7 0 L8.2 5.8 L14 7 L8.2 8.2 L7 14 L5.8 8.2 L0 7 L5.8 5.8 Z"
          fill="url(#spark-grad)"/>
  </svg>
  <div id="badges"></div>
  <div id="response"></div>

  <div id="companion" data-state="listening">
    <div id="eq-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div class="mini-spin"></div>
  </div>

  <script>
    console.log('[Clicky overlay] script loaded, window.clicky =', !!window.clicky);

    // ---- Cursor buddy tracking ----
    const cursorBuddy = document.getElementById('cursor-buddy');
    let buddyWanted = false;   // does the main process want the spark shown here?

    // The spark is the IDLE indicator only. Listening/thinking have their own
    // motion (eq-bars / spinner), so suppress the spark in those states. Shown
    // only when main is streaming it (enabled + cursor on this display) AND idle.
    function applyBuddyVisibility() {
      cursorBuddy.classList.toggle('visible', buddyWanted && companionState === 'idle');
    }

    if (window.clicky && window.clicky.onCursorBuddy) {
      window.clicky.onCursorBuddy((x, y) => {
        cursorBuddy.style.left = x + 'px';
        cursorBuddy.style.top = y + 'px';
        buddyWanted = true;
        applyBuddyVisibility();
      });
    }
    if (window.clicky && window.clicky.onCursorBuddyVisible) {
      window.clicky.onCursorBuddyVisible((visible) => {
        buddyWanted = !!visible;
        applyBuddyVisibility();
      });
    }

    // ---- Cursor companion: listening (eq bars) + thinking (conic spinner) ----
    const companion = document.getElementById('companion');
    let companionState = 'idle';            // 'idle' | 'listening' | 'thinking'
    const anchor = { active: false, x: 0, y: 0 };   // live cursor pos on this display

    function updateCompanion() {
      const show = companionState !== 'idle' && anchor.active;
      if (companionState !== 'idle') companion.dataset.state = companionState;
      companion.classList.toggle('visible', show);
      applyBuddyVisibility();   // hide the spark while listening/thinking; restore on idle
    }

    if (window.clicky && window.clicky.onCompanionAnchor) {
      window.clicky.onCompanionAnchor((data) => {
        anchor.active = data.active;
        if (data.active) {
          anchor.x = data.x;
          anchor.y = data.y;
          companion.style.left = data.x + 'px';
          companion.style.top = data.y + 'px';
        }
        // Caption-follows-cursor: the pill rides whichever display holds the
        // cursor, migrating across monitors live. Only while a caption is active,
        // enabled, revealing, and following (the tray toggle); pinned mode never
        // migrates. The CSS left/top transition smooths motion into a gentle trail.
        if (capActive && capEnabled && captionFollow && revealStarted) {
          if (data.active && !capOwner) {
            // Cursor just arrived on this display — take over the pill. Jump to
            // the fully-revealed text: the typewriter already ran on the prior
            // display, and replaying it here would desync from the voice.
            capOwner = true;
            capAnchor = { x: data.x, y: data.y };
            if (capShown < capTarget.length) capShown = capTarget.length;
            captionRender();
            captionShow();
          } else if (data.active) {
            capAnchor = { x: data.x, y: data.y };
            captionPlace();
          } else if (capOwner) {
            // Cursor left this display — release the pill (hide it here; the
            // display the cursor moved to picks it up). Drop the anchor so a
            // later delta can't re-show the hidden pill, and stop the typewriter.
            capOwner = false;
            capAnchor = null;
            if (capTypeTimer) { clearInterval(capTypeTimer); capTypeTimer = null; }
            responseEl.classList.remove('visible');
          }
        }
        updateCompanion();
      });
    } else {
      console.error('[Clicky overlay] window.clicky.onCompanionAnchor is not available!');
    }

    if (window.clicky && window.clicky.onRecordingChanged) {
      window.clicky.onRecordingChanged((isRecording) => {
        if (isRecording) companionState = 'listening';
        // Mic released → transcription + query follow. Bridge straight to
        // 'thinking' (the pipeline's 'capturing'/'querying' stages arrive a beat
        // later) so we never flash 'idle' — which would briefly resurface the
        // spark. A terminal 'done' (success, or the no-query paths in audio.ts)
        // returns us to idle; Escape uses a separate 'recording-cancelled' event.
        else if (companionState === 'listening') companionState = 'thinking';
        updateCompanion();
      });
    }
    if (window.clicky && window.clicky.onStage) {
      window.clicky.onStage(({ stage }) => {
        companionState = (stage === 'speaking' || stage === 'done') ? 'idle' : 'thinking';
        updateCompanion();
      });
    }
    if (window.clicky && window.clicky.onRecordingCancelled) {
      window.clicky.onRecordingCancelled(() => { companionState = 'idle'; updateCompanion(); });
    }

    // ====================================================================
    // Companion pill + numbered constellation.
    //
    // One unified flow for all three cases (no pointer / one / multiple):
    //   - The caption is the FULL reply, anchored ONCE at the cursor, typed out
    //     in place. It never moves or re-segments while the voice plays.
    //   - Each point gets a badge: a plain dot when there's a single pointer,
    //     a numbered dot when there are two or more (the global count comes from
    //     the main process via overlay:point-count, since each window only sees
    //     its own display's points). Badges cascade in (quick entrance) and each
    //     carries a short label chip.
    //   - Reveal (caption typing + cascade) is gated on the voice starting
    //     (companion:speaking-started); with TTS off it begins promptly. After
    //     the voice ends (or a word-count estimate when TTS is off) everything
    //     holds for an absorb buffer — 5s for ≥2 points, else 1.5s — then the
    //     pill and all badges fade together.
    // ====================================================================
    const responseEl = document.getElementById('response');
    const badgesEl = document.getElementById('badges');
    const capReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const CAP_CHAR_INTERVAL = 70;    // ms per character (~14 cps, reading pace)
    const CAP_MS_PER_WORD = 390;     // ~155 wpm — speech-duration estimate (TTS-off)
    const CAP_OFFSET_X = 14;
    const CAP_OFFSET_Y = 26;
    const HOLD_MULTI = 5000;         // absorb buffer after voice, ≥2 points
    const HOLD_SINGLE = 1500;        // absorb buffer after voice, 0–1 points
    const REVEAL_BACKSTOP = 4000;    // ms to start reveal if no voice signal arrives
    const BADGE_STAGGER = 500;       // ms between cascade reveals
    const FADE_MS = 360;             // pill/badge fade-out before DOM clear
    const VOICE_HANG_PAD = 10000;    // extra slack on the TTS-on hang backstop so a
                                     // dropped speaking-ended can't strand the pill,
                                     // without the estimate ever preempting real speech

    // POINT-tag stripping — kept in sync with chat/index.html (source of truth).
    const CAP_POINT_RE = /\[POINT:[^\]]+\]/g;
    function stripPointTags(text) {
      const withoutComplete = text.replace(CAP_POINT_RE, '');
      const trailingOpen = withoutComplete.match(/\[[^\]]*$/);
      if (trailingOpen && /\[POINT:/i.test(trailingOpen[0])) {
        return withoutComplete.slice(0, trailingOpen.index);
      }
      return withoutComplete;
    }

    // ---- settings (cached; refreshed each stream-start) ----
    let capEnabled = true;          // show the pill text at all
    let captionFollow = true;       // pill follows the cursor (tray toggle); else stays put
    let ttsOn = true;               // is TTS enabled? gates whether we wait for voice

    // ---- caption state ----
    let capActive = false;          // a reply is currently streaming/showing
    let capRaw = '';                // accumulated raw delta text (POINT tags intact)
    let capTarget = '';             // stripped text we want revealed
    let capShown = 0;               // chars revealed so far
    let capAnchor = null;           // {x,y} once decided (display-local px)
    let capEnded = false;           // stream-end received
    let capVoiceEnded = false;      // voice finished (real signal or estimate)
    let capTypeTimer = null;
    let capBodyEl = null;
    let capOwner = false;           // this window currently shows the pill (the
                                    // display the cursor is on); drives migration

    // ---- lifecycle state ----
    let revealStarted = false;      // reveal (caption + cascade) has begun
    let finished = false;           // finishAll has been armed
    let revealBackstop = null;      // start-reveal backstop timer
    let fallbackTimer = null;       // TTS-off "voice done" estimate timer
    let hideTimer = null;           // absorb-buffer timer before fade
    let token = 0;                  // bumped each query; guards delayed clears

    // ---- constellation state ----
    const badges = new Map();       // id -> { id, index, x, y, label, el, chipEl }
    const order = [];               // ids in arrival order
    let globalCount = 0;            // total points across all displays (from main)
    let scheduledUntil = 0;         // perf-time of the last scheduled cascade reveal
    const staggerTimers = [];       // pending cascade setTimeouts (cleared on reset)

    // ---------- caption pill mechanics ----------
    function captionRevealDone() { return capShown >= capTarget.length; }

    function captionEnsureDom() {
      if (capBodyEl) return;
      responseEl.innerHTML = '';
      capBodyEl = document.createElement('span');
      capBodyEl.className = 'cap-body';
      responseEl.appendChild(capBodyEl);
    }

    function captionRender() {
      captionEnsureDom();
      if (capShown > capTarget.length) capShown = capTarget.length;
      capBodyEl.textContent = capTarget.slice(0, capShown);
      const done = capEnded && captionRevealDone();
      if (!capReduced && !done) {
        const caret = document.createElement('span');
        caret.className = 'cap-caret';
        capBodyEl.appendChild(caret);
      }
    }

    // Anchor-relative placement, flipping to stay on-screen once size is known.
    function captionPlace() {
      if (!capAnchor) return;
      const vw = window.innerWidth, vh = window.innerHeight;
      const rect = responseEl.getBoundingClientRect();
      const w = rect.width || 200, h = rect.height || 40;
      let x = capAnchor.x + CAP_OFFSET_X;
      let y = capAnchor.y + CAP_OFFSET_Y;
      let tail = 'top';
      let tailx = 'left';
      if (x + w > vw - 8) {                  // overflow right -> flip left
        x = capAnchor.x - w - CAP_OFFSET_X;
        if (x < 8) x = Math.max(8, vw - w - 8);
        tailx = 'right';
      }
      if (y + h > vh - 8) {                  // overflow bottom -> flip above
        y = capAnchor.y - h - CAP_OFFSET_Y;
        tail = 'bottom';
        if (y < 8) y = 8;
      }
      responseEl.style.left = x + 'px';
      responseEl.style.top = y + 'px';
      responseEl.dataset.tail = tail;
      responseEl.dataset.tailx = tailx;
    }

    function captionShow() {
      if (!capTarget) return;   // no text yet — don't reveal an empty pill
      if (!responseEl.classList.contains('visible')) {
        captionPlace();
        requestAnimationFrame(() => responseEl.classList.add('visible'));
      }
    }

    function captionTick() {
      if (captionRevealDone()) {
        clearInterval(capTypeTimer); capTypeTimer = null;
        captionRender();
        captionPlace();                      // re-flip now that size has settled
        maybeFinish();
        return;
      }
      capShown++;
      captionRender();
    }

    function captionStartTyping() {
      if (!capAnchor || !capEnabled) return;
      if (capReduced) {                      // reveal instantly, no animation
        capShown = capTarget.length;
        captionRender();
        captionPlace();
        maybeFinish();
        return;
      }
      if (!capTypeTimer && capShown < capTarget.length) {
        capTypeTimer = setInterval(captionTick, CAP_CHAR_INTERVAL);
      }
    }

    // ---------- constellation ----------
    function makeBadge(p) {
      const el = document.createElement('div');
      el.className = 'badge';
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      const chipEl = document.createElement('div');
      chipEl.className = 'chip';
      chipEl.style.left = p.x + 'px';
      chipEl.style.top = p.y + 'px';
      chipEl.textContent = p.label || '';
      badgesEl.appendChild(el);
      badgesEl.appendChild(chipEl);
      return { el, chipEl };
    }

    // Plain dot for a single pointer; the global step number for two or more.
    function applyNumbering() {
      const numbered = globalCount >= 2;
      for (const rec of badges.values()) {
        rec.el.textContent = numbered && rec.index != null ? String(rec.index) : '';
      }
    }

    function revealBadge(rec) {
      rec.el.classList.add('show');
      if (rec.label) rec.chipEl.classList.add('show');
    }

    // Reveal-on-arrival with a minimum gap → a quick cascade for batched
    // arrivals, just-in-time for trickled ones. Never a slow per-step walk.
    function scheduleReveal(rec) {
      if (capReduced) { revealBadge(rec); return; }
      const now = performance.now();
      const at = Math.max(now, scheduledUntil + BADGE_STAGGER);
      scheduledUntil = at;
      staggerTimers.push(setTimeout(() => revealBadge(rec), at - now));
    }

    // Begin the reveal once (guarded): anchor the caption at the cursor and
    // start typing, then cascade any badges already queued. Triggered by voice
    // start, the TTS-off path, the backstop, or (last chance) stream-end.
    function beginReveal() {
      if (revealStarted) return;
      revealStarted = true;
      if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
      if (capEnabled && !capAnchor && anchor.active) {
        capAnchor = { x: anchor.x, y: anchor.y };  // anchor where the cursor is now
        capOwner = true;                           // this display shows the pill
        captionShow();
        captionStartTyping();
      }
      scheduledUntil = 0;
      for (const id of order) {
        const rec = badges.get(id);
        if (rec) scheduleReveal(rec);
      }
    }

    function onRawPoint(p) {
      if (badges.has(p.id)) return;
      const { el, chipEl } = makeBadge(p);
      const rec = { id: p.id, index: p.index, x: p.x, y: p.y, label: p.label, el, chipEl };
      badges.set(p.id, rec);
      order.push(p.id);
      applyNumbering();
      if (revealStarted) scheduleReveal(rec);
    }

    function onRefinePoint(p) {
      const rec = badges.get(p.id);
      if (!rec) return;
      if (typeof p.x === 'number') { rec.x = p.x; rec.el.style.left = p.x + 'px'; rec.chipEl.style.left = p.x + 'px'; }
      if (typeof p.y === 'number') { rec.y = p.y; rec.el.style.top = p.y + 'px'; rec.chipEl.style.top = p.y + 'px'; }
      if (typeof p.label === 'string') { rec.label = p.label; rec.chipEl.textContent = p.label; }
    }

    // ---------- finish / fade ----------
    function maybeFinish() {
      if (finished || !capEnded || !capVoiceEnded) return;
      // If this window owns the pill, wait for it to finish typing so a fast
      // voice can't fade the text mid-reveal. (Badge-only / released windows
      // don't own a pill, so they don't wait.)
      if (capEnabled && capOwner && !captionRevealDone()) return;
      finished = true;
      if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
      const holdMs = globalCount >= 2 ? HOLD_MULTI : HOLD_SINGLE;
      hideTimer = setTimeout(fadeAll, holdMs);
    }

    function fadeAll() {
      const myToken = token;
      // Stop the pill following the cursor the instant the fade begins, so a
      // mouse move into another display can't re-acquire a pill that's leaving.
      capActive = false;
      capOwner = false;
      responseEl.classList.remove('visible');
      for (const rec of badges.values()) {
        rec.el.classList.remove('show');
        rec.chipEl.classList.remove('show');
      }
      setTimeout(() => {
        if (token !== myToken) return;   // a new query started — don't wipe it
        responseEl.innerHTML = '';
        responseEl.dataset.tail = 'top';
        responseEl.dataset.tailx = 'left';
        capBodyEl = null;
        badgesEl.innerHTML = '';
        badges.clear();
        order.length = 0;
      }, FADE_MS);
    }

    function resetAll() {
      token++;
      for (const t of staggerTimers) clearTimeout(t);
      staggerTimers.length = 0;
      if (capTypeTimer) { clearInterval(capTypeTimer); capTypeTimer = null; }
      if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
      if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      capActive = false; capOwner = false;
      capRaw = ''; capTarget = ''; capShown = 0; capAnchor = null;
      capEnded = false; capVoiceEnded = false; capBodyEl = null;
      revealStarted = false; finished = false;
      globalCount = 0; scheduledUntil = 0;
      badges.clear(); order.length = 0;
      badgesEl.innerHTML = '';
      responseEl.classList.remove('visible');
      responseEl.innerHTML = '';
      responseEl.dataset.tail = 'top';
      responseEl.dataset.tailx = 'left';
    }

    // ---------- IPC wiring ----------
    if (window.clicky && window.clicky.onPoint) {
      window.clicky.onPoint((p) => {
        if (!p || p.kind === 'reset') { resetAll(); return; }
        if (p.kind === 'refine') { onRefinePoint(p); return; }
        onRawPoint(p);
      });
    } else {
      console.error('[Clicky overlay] window.clicky.onPoint is not available!');
    }

    if (window.clicky && window.clicky.onPointCount) {
      window.clicky.onPointCount((count) => {
        if (typeof count === 'number') globalCount = count;
        applyNumbering();
      });
    }

    if (window.clicky && window.clicky.onStreamStart) {
      window.clicky.onStreamStart(() => {
        resetAll();
        capActive = true;
        // Backstop: start the reveal even if no voice signal ever arrives
        // (TTS error, or the 0-point case where no point handler runs).
        revealBackstop = setTimeout(beginReveal, REVEAL_BACKSTOP);
        if (window.clicky.getSettings) {
          window.clicky.getSettings().then((s) => {
            capEnabled = s ? s.overlayCaptionEnabled !== false : true;
            captionFollow = s ? s.overlayCaptionFollowCursor !== false : true;
            ttsOn = s ? s.ttsEnabled !== false : true;
            if (!capEnabled) responseEl.classList.remove('visible');
            if (!ttsOn && !revealStarted) beginReveal();  // no voice to wait for
          }).catch(() => {});
        }
      });
    }

    if (window.clicky && window.clicky.onStreamDelta) {
      window.clicky.onStreamDelta(({ text }) => {
        if (!text || !capActive || !capEnabled) return;
        capRaw += text;
        capTarget = stripPointTags(capRaw).replace(/^\s+/, '');  // ltrim only
        if (revealStarted && capAnchor) { captionShow(); captionStartTyping(); }
      });
    }

    if (window.clicky && window.clicky.onStreamEnd) {
      window.clicky.onStreamEnd(({ text, error }) => {
        if (!capActive) return;
        if (error) { resetAll(); return; }
        capEnded = true;
        if (typeof text === 'string' && text) {
          capRaw = text;
          capTarget = stripPointTags(text).trim();
        }
        if (!revealStarted) beginReveal();             // last chance to anchor
        if (capEnabled && capAnchor) { captionShow(); captionStartTyping(); }

        // "Voice done" fallback. With TTS off, the estimated speech duration IS
        // the signal (no real speaking-ended ever comes). With TTS on, the real
        // companion:speaking-ended is authoritative — here we only arm a generous
        // backstop (estimate + pad) so a dropped signal can't strand the pill,
        // padded so it never fires before speech that started late actually ends.
        const words = capTarget.trim() ? capTarget.trim().split(/\s+/).length : 0;
        const estSpeechMs = words * CAP_MS_PER_WORD;
        const revealRemainingMs = Math.max(0, capTarget.length - capShown) * CAP_CHAR_INTERVAL;
        const baseMs = Math.max(revealRemainingMs, estSpeechMs);
        if (fallbackTimer) clearTimeout(fallbackTimer);
        fallbackTimer = setTimeout(() => {
          fallbackTimer = null;
          capVoiceEnded = true;
          maybeFinish();
        }, ttsOn ? baseMs + VOICE_HANG_PAD : baseMs);

        maybeFinish();  // very short reply: voice may have already ended
      });
    }

    if (window.clicky && window.clicky.onSpeakingStarted) {
      window.clicky.onSpeakingStarted(() => {
        if (!capActive) return;            // stale event from a prior query
        if (!revealStarted) beginReveal();
      });
    }

    if (window.clicky && window.clicky.onSpeakingEnded) {
      window.clicky.onSpeakingEnded(() => {
        if (!capActive) return;            // stale event from a prior query
        capVoiceEnded = true;
        maybeFinish();
      });
    }

    // Prime the cached settings at load.
    if (window.clicky && window.clicky.getSettings) {
      window.clicky.getSettings()
        .then((s) => {
          capEnabled = s ? s.overlayCaptionEnabled !== false : true;
          captionFollow = s ? s.overlayCaptionFollowCursor !== false : true;
          ttsOn = s ? s.ttsEnabled !== false : true;
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
