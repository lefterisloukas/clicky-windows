<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Clicky Overlay</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    #cursor {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.95);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.9), 0 0 60px rgba(59, 130, 246, 0.6), 0 0 0 4px rgba(255, 255, 255, 0.9);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: left 0.4s ease-out, top 0.4s ease-out, opacity 0.3s ease;
      z-index: 9999;
    }

    #cursor.visible {
      opacity: 1;
    }

    #cursor::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.4);
      animation: pulse 1.5s ease-in-out infinite;
    }

    #label {
      position: absolute;
      transform: translate(-50%, 20px);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #label.visible {
      opacity: 1;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(2); opacity: 0; }
    }

    /* Cursor buddy — 4-pointed spark that follows the cursor, anchored
       bottom-right of the cursor tip so it never covers the hotspot. */
    #cursor-buddy {
      position: absolute;
      width: 14px;
      height: 14px;
      /* offset so the spark sits below-right of the cursor tip */
      transform: translate(8px, 8px);
      pointer-events: none;
      z-index: 9998;
      opacity: 0;
      transition: opacity 0.3s ease;
      animation: sparkSpin 7s linear infinite, sparkPulse 2s ease-in-out infinite;
    }

    #cursor-buddy.visible {
      opacity: 0.82;
    }

    @keyframes sparkSpin {
      to { transform: translate(8px, 8px) rotate(360deg); }
    }

    @keyframes sparkPulse {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.8)) drop-shadow(0 0 8px rgba(34, 211, 238, 0.3)); }
      50%       { filter: drop-shadow(0 0 7px rgba(34, 211, 238, 1.0)) drop-shadow(0 0 14px rgba(34, 211, 238, 0.5)); }
    }

    @media (prefers-reduced-motion: reduce) {
      #cursor-buddy { animation: none; transform: translate(8px, 8px); }
    }

    /* Cursor companion — bare animation anchored bottom-right of cursor tip.
       No background, no border, no text — just the motion. */
    #companion {
      --c: #22D3EE;
      position: absolute;
      left: 0;
      top: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* sit 14 px right and 14 px below the cursor tip */
      transform: translate(14px, 14px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 10000;
    }

    #companion.visible { opacity: 0.72; }
    #companion[data-state="listening"] { --c: #22D3EE; }
    #companion[data-state="thinking"]  { --c: #3B82F6; }

    /* Listening: 5 equalizer bars */
    #eq-bars {
      display: none;
      align-items: center;
      gap: 2.5px;
      height: 22px;
    }
    #eq-bars .bar {
      width: 3px;
      border-radius: 2px;
      background: var(--c);
      box-shadow: 0 0 7px rgba(34, 211, 238, 0.8);
      animation: barDance 1s ease-in-out infinite;
    }
    #eq-bars .bar:nth-child(1) { --bh: 7px;  animation-delay: 0s; }
    #eq-bars .bar:nth-child(2) { --bh: 14px; animation-delay: 0.11s; }
    #eq-bars .bar:nth-child(3) { --bh: 20px; animation-delay: 0.22s; }
    #eq-bars .bar:nth-child(4) { --bh: 14px; animation-delay: 0.33s; }
    #eq-bars .bar:nth-child(5) { --bh: 7px;  animation-delay: 0.44s; }

    @keyframes barDance {
      0%, 100% { height: calc(var(--bh) * 0.35); }
      50%       { height: var(--bh); }
    }

    /* Thinking: conic-gradient ring spinner (unchanged from previous design) */
    #companion .mini-spin {
      display: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, var(--c) 300deg, transparent 360deg);
      -webkit-mask: radial-gradient(circle 5px at center, transparent 96%, #000 100%);
              mask: radial-gradient(circle 5px at center, transparent 96%, #000 100%);
      animation: spin 1.35s linear infinite;
      filter: drop-shadow(0 0 5px var(--c));
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #companion[data-state="listening"] #eq-bars    { display: flex; }
    #companion[data-state="thinking"]  .mini-spin  { display: block; }

    @media (prefers-reduced-motion: reduce) {
      #companion .mini-spin { animation: none; }
      #eq-bars .bar { animation: none; height: var(--bh); }
    }
  </style>
</head>
<body>
  <svg id="cursor-buddy" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="spark-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="35%"  stop-color="#22D3EE" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.3"/>
      </radialGradient>
    </defs>
    <!-- 4-pointed star: two overlapping diamond shapes -->
    <path d="M7 0 L8.2 5.8 L14 7 L8.2 8.2 L7 14 L5.8 8.2 L0 7 L5.8 5.8 Z"
          fill="url(#spark-grad)"/>
  </svg>
  <div id="cursor"></div>
  <div id="label"></div>

  <div id="companion" data-state="listening">
    <div id="eq-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div class="mini-spin"></div>
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    const label = document.getElementById('label');

    console.log('[Clicky overlay] script loaded, window.clicky =', !!window.clicky);

    // Handle point-at animations.
    //
    // Points now stream in one at a time as the model generates, rather than
    // arriving as a single batch. We keep a queue keyed by id and walk through
    // them sequentially (each shown for a minimum dwell) so multi-step
    // instructions still read as "step 1 → step 2". A `kind:"refine"` message
    // carries sharper coordinates for an already-seen id and updates it in
    // place (the CSS left/top transition animates the nudge). `kind:"reset"`
    // clears everything at the start of a new query.
    if (window.clicky && window.clicky.onPoint) {
      const MIN_DWELL = 2000;   // ms each point stays before advancing
      const HIDE_AFTER = 3000;  // ms after the last point before hiding

      const points = new Map();  // id -> { x, y, label, shown }
      const order = [];          // ids in arrival order
      let activeId = null;
      let dwellTimer = null;
      let hideTimer = null;

      function renderPoint(pt) {
        cursor.style.left = pt.x + 'px';
        cursor.style.top = pt.y + 'px';
        cursor.classList.add('visible');
        label.style.left = pt.x + 'px';
        label.style.top = pt.y + 'px';
        label.textContent = pt.label || '';
        label.classList.add('visible');
      }

      function scheduleHide() {
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          cursor.classList.remove('visible');
          label.classList.remove('visible');
        }, HIDE_AFTER);
      }

      function advance() {
        const nextId = order.find((id) => points.has(id) && !points.get(id).shown);
        if (nextId == null) {
          activeId = null;
          scheduleHide();
          return;
        }
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        activeId = nextId;
        const pt = points.get(nextId);
        pt.shown = true;
        renderPoint(pt);
        dwellTimer = setTimeout(() => { activeId = null; advance(); }, MIN_DWELL);
      }

      function reset() {
        if (dwellTimer) { clearTimeout(dwellTimer); dwellTimer = null; }
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        points.clear();
        order.length = 0;
        activeId = null;
        cursor.classList.remove('visible');
        label.classList.remove('visible');
      }

      window.clicky.onPoint((p) => {
        console.log('[Clicky overlay] onPoint', JSON.stringify(p));
        if (!p || p.kind === 'reset') { reset(); return; }

        if (p.kind === 'refine') {
          const ex = points.get(p.id);
          if (ex) {
            ex.x = p.x; ex.y = p.y;
            if (typeof p.label === 'string') ex.label = p.label;
            if (activeId === p.id) renderPoint(ex);  // animate the correction
          }
          return;
        }

        // kind === 'raw' (or legacy/no kind) — enqueue a new point.
        if (!points.has(p.id)) order.push(p.id);
        points.set(p.id, { x: p.x, y: p.y, label: p.label, shown: false });
        if (activeId === null) advance();
      });
    } else {
      console.error('[Clicky overlay] window.clicky.onPoint is not available!');
    }

    // Handle cursor buddy tracking
    const cursorBuddy = document.getElementById('cursor-buddy');

    window.clicky.onCursorBuddy((x, y) => {
      cursorBuddy.style.left = x + 'px';
      cursorBuddy.style.top = y + 'px';
      if (!cursorBuddy.classList.contains('visible')) {
        cursorBuddy.classList.add('visible');
      }
    });

    window.clicky.onCursorBuddyVisible((visible) => {
      if (visible) {
        cursorBuddy.classList.add('visible');
      } else {
        cursorBuddy.classList.remove('visible');
      }
    });

    // ---- Cursor companion: listening (eq bars) + thinking (conic spinner) ----
    const companion = document.getElementById('companion');

    let companionState = 'idle';            // 'idle' | 'listening' | 'thinking'
    const anchor = { active: false, x: 0, y: 0 };

    function updateCompanion() {
      const show = companionState !== 'idle' && anchor.active;
      if (companionState !== 'idle') {
        companion.dataset.state = companionState;
      }
      companion.classList.toggle('visible', show);
    }

    if (window.clicky && window.clicky.onCompanionAnchor) {
      window.clicky.onCompanionAnchor((data) => {
        anchor.active = data.active;
        if (data.active) {
          anchor.x = data.x;
          anchor.y = data.y;
          companion.style.left = data.x + 'px';
          companion.style.top = data.y + 'px';
        }
        updateCompanion();
      });
    } else {
      console.error('[Clicky overlay] window.clicky.onCompanionAnchor is not available!');
    }

    // recording -> listening
    if (window.clicky && window.clicky.onRecordingChanged) {
      window.clicky.onRecordingChanged((isRecording) => {
        if (isRecording) {
          companionState = 'listening';
        } else if (companionState === 'listening') {
          companionState = 'idle';
        }
        updateCompanion();
      });
    }

    // processing stages -> thinking
    if (window.clicky && window.clicky.onStage) {
      window.clicky.onStage(({ stage }) => {
        if (stage === 'speaking' || stage === 'done') {
          companionState = 'idle';
        } else {
          companionState = 'thinking';
        }
        updateCompanion();
      });
    }

    // Escape during recording -> cancel
    if (window.clicky && window.clicky.onRecordingCancelled) {
      window.clicky.onRecordingCancelled(() => {
        companionState = 'idle';
        updateCompanion();
      });
    }
  </script>
</body>
</html>
