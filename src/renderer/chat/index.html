<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Clicky</title>
  <script>
    // Stamp the theme main passed via ?theme=… BEFORE the stylesheet applies,
    // so the first paint is already the right theme (no flash-of-default).
    if (window.clicky) window.clicky.applyTheme(new URLSearchParams(location.search).get('theme'));
  </script>
  <link rel="stylesheet" href="../theme.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    /* Semantic role tokens (--bg --surface --text --muted --accent …) come from
       ../theme.css and remap with data-theme on <html>. The names below are local
       aliases the rest of this window already references; the ones that collide
       with role names (--border, --accent, --accent-hover) are intentionally NOT
       redefined here so they inherit the role values directly. */
    :root {
      --bg-primary: var(--bg);
      --bg-secondary: var(--surface);
      --bg-tertiary: var(--surface-2);
      --bg-hover: color-mix(in srgb, var(--text) 8%, transparent);
      --border-focus: var(--focus-ring);
      --text-primary: var(--text);
      --text-secondary: var(--muted);
      --text-tertiary: color-mix(in srgb, var(--muted) 60%, transparent);
      --accent-glow: var(--cursor-glow);
      --success: var(--ok);
      --error: var(--danger);
      --msg-user: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      --msg-assistant: var(--surface-2);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Title Bar ── */
    #titlebar {
      height: 48px;
      padding: 0 16px;
      background: color-mix(in srgb, var(--surface) 45%, transparent);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      backdrop-filter: blur(40px);
    }

    #titlebar .logo {
      width: 28px;
      height: 28px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 6px var(--cursor-glow));
    }

    #titlebar .logo svg {
      width: 22px;
      height: 22px;
    }

    #titlebar .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    #titlebar .status {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-tertiary);
      margin-left: auto;
      transition: all 0.4s ease;
    }

    #titlebar .status.connected {
      background: var(--success);
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
    }

    #titlebar .gear-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      font-size: 16px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
    }

    #titlebar .gear-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .window-controls {
      display: flex;
      gap: 2px;
      margin-left: 4px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 28px;
      height: 28px;
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .win-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .win-btn.close:hover {
      background: color-mix(in srgb, var(--danger) 20%, transparent);
      color: var(--error);
    }

    /* ── Setup Panel ── */
    #setup {
      padding: 20px;
      background: color-mix(in srgb, var(--surface) 45%, transparent);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #setup.hidden { display: none; }
    #setup-cta.hidden { display: none !important; }

    #setup h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .key-group {
      margin-bottom: 12px;
    }

    .key-group:last-of-type { margin-bottom: 16px; }

    .key-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .key-group label .badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .badge.required { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--error); }
    .badge.optional { background: var(--bg-tertiary); color: var(--text-tertiary); }

    .key-group input {
      width: 100%;
      padding: 9px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 12px;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      outline: none;
      transition: all 0.2s ease;
    }

    .key-group input::placeholder { color: var(--text-tertiary); }

    .key-group input:focus {
      border-color: var(--border-focus);
      background: var(--bg-tertiary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .key-group input.error {
      border-color: color-mix(in srgb, var(--danger) 50%, transparent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 10%, transparent);
    }

    .setup-footer {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-primary {
      padding: 8px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 2px 12px rgba(99, 140, 255, 0.3);
    }

    .btn-primary:active { transform: scale(0.97); }

    .setup-footer .saved {
      font-size: 11px;
      color: var(--success);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .setup-footer .saved.visible { opacity: 1; }

    .setup-hint {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 8px;
    }

    .setup-hint a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text) 18%, transparent);
      border-radius: 4px;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
      animation: msgIn 0.25s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--msg-user);
      color: #fff;
      border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
      box-shadow: 0 2px 8px rgba(99, 140, 255, 0.2);
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--msg-assistant);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
      color: var(--text-primary);
    }

    .msg.system {
      align-self: center;
      color: var(--text-tertiary);
      font-size: 12px;
      background: none;
      padding: 8px 0;
    }

    /* Markdown in assistant messages — compact spacing */
    .msg.assistant p { margin: 0 0 4px; line-height: 1.5; }
    .msg.assistant p:last-child { margin-bottom: 0; }
    .msg.assistant p + p { margin-top: 2px; }
    .msg.assistant br { display: block; content: ''; margin: 1px 0; }
    .msg.assistant ul, .msg.assistant ol { margin: 2px 0 4px 16px; padding: 0; }
    .msg.assistant li { margin: 1px 0; line-height: 1.4; }
    .msg.assistant li p { margin: 0; display: inline; }
    .msg.assistant ul ul, .msg.assistant ol ol, .msg.assistant ul ol, .msg.assistant ol ul {
      margin: 1px 0 1px 14px;
    }
    .msg.assistant strong { color: #fff; font-weight: 600; }
    .msg.assistant em { color: var(--text-secondary); }
    .msg.assistant h1, .msg.assistant h2, .msg.assistant h3,
    .msg.assistant h4, .msg.assistant h5, .msg.assistant h6 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin: 6px 0 2px;
      line-height: 1.3;
    }
    .msg.assistant h1:first-child, .msg.assistant h2:first-child,
    .msg.assistant h3:first-child, .msg.assistant h4:first-child {
      margin-top: 0;
    }
    .msg.assistant hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 6px 0;
    }

    .msg.assistant code {
      background: color-mix(in srgb, var(--text) 10%, transparent);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Cascadia Code', 'Consolas', 'SF Mono', monospace;
      font-size: 12px;
      color: var(--accent);
    }

    .msg.assistant pre {
      background: color-mix(in srgb, var(--text) 10%, transparent);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin: 4px 0;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.4;
    }

    .msg.assistant pre code {
      background: none;
      padding: 0;
      border-radius: 0;
      color: var(--text-primary);
    }

    .msg.assistant blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      margin: 4px 0;
      color: var(--text-secondary);
    }

    .msg.assistant blockquote p { margin: 0; }

    .msg.assistant a {
      color: var(--accent);
      text-decoration: none;
    }

    .msg.assistant a:hover { text-decoration: underline; }

    .msg.assistant table {
      border-collapse: collapse;
      margin: 4px 0;
      font-size: 12px;
      width: 100%;
    }

    .msg.assistant th, .msg.assistant td {
      border: 1px solid var(--border);
      padding: 3px 8px;
      text-align: left;
    }

    .msg.assistant th {
      background: var(--surface-2);
      font-weight: 600;
    }

    /* Loading indicator */
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      align-items: center;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-tertiary);
      animation: typingPulse 1.4s ease-in-out infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingPulse {
      0%, 60%, 100% { transform: scale(1); opacity: 0.4; }
      30% { transform: scale(1.3); opacity: 1; }
    }

    /* ── Input Area ── */
    #input-area {
      padding: 14px 16px;
      background: color-mix(in srgb, var(--surface) 45%, transparent);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      backdrop-filter: blur(40px);
    }

    #input {
      flex: 1;
      padding: 10px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    #input:focus {
      border-color: var(--border-focus);
      background: var(--bg-tertiary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #input::placeholder { color: var(--text-tertiary); }
    #input:disabled { opacity: 0.35; }

    #send {
      width: 36px;
      height: 36px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    #send:hover {
      background: var(--accent-hover);
      box-shadow: 0 2px 12px var(--cursor-glow);
      transform: scale(1.05);
    }

    #send:active { transform: scale(0.95); }
    #send:disabled { background: var(--bg-tertiary); cursor: not-allowed; transform: none; box-shadow: none; }

    .mic-btn {
      width: 36px;
      height: 36px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .mic-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .mic-btn.recording {
      background: color-mix(in srgb, var(--record) 15%, transparent);
      border-color: color-mix(in srgb, var(--record) 50%, transparent);
      color: var(--record);
      animation: micPulse 1.5s ease-in-out infinite;
    }

    .mic-btn.processing {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
      animation: micSpin 1s linear infinite;
    }

    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); }
      50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
    }

    @keyframes micSpin {
      from { opacity: 1; }
      50% { opacity: 0.5; }
      to { opacity: 1; }
    }

    /* ── Status Bar ── */
    .status-bar {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 45%, transparent);
      animation: statusIn 0.2s ease;
    }

    .status-bar.hidden { display: none; }

    .status-bar.recording {
      color: var(--record);
      background: color-mix(in srgb, var(--record) 5%, transparent);
      border-top-color: color-mix(in srgb, var(--record) 15%, transparent);
    }

    .status-bar.thinking {
      color: var(--accent);
      background: rgba(99, 140, 255, 0.05);
      border-top-color: rgba(99, 140, 255, 0.15);
    }

    .status-bar.speaking {
      color: var(--success);
      background: rgba(52, 211, 153, 0.05);
      border-top-color: rgba(52, 211, 153, 0.15);
    }

    @keyframes statusIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-dot-anim {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: statusPulse 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .tts-btn {
      height: 36px;
      padding: 0 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.2s ease;
      flex-shrink: 0;
      font-family: inherit;
    }

    .tts-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .tts-btn.active-local {
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.4);
      color: var(--success);
    }

    .tts-btn.active-cloud {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }

    #send svg { width: 16px; height: 16px; }

    /* ── Welcome state ── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px;
      text-align: center;
    }

    .welcome .icon {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      filter: drop-shadow(0 4px 20px var(--cursor-glow));
    }

    .welcome .icon svg {
      width: 48px;
      height: 48px;
    }

    .welcome h2 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .welcome p {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 260px;
    }

    .welcome .shortcuts {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .welcome .shortcuts kbd {
      padding: 3px 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 10px;
      font-family: inherit;
      color: var(--text-secondary);
    }

    /* ── Help Links ── */
    .help-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      justify-content: center;
    }

    .help-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .help-link:hover {
      background: var(--bg-hover);
      border-color: var(--border);
      color: var(--text-primary);
    }

    .help-link svg {
      width: 12px;
      height: 12px;
      opacity: 0.5;
      flex-shrink: 0;
    }

    .help-link:hover svg { opacity: 0.8; }

    /* ── Help Dropdown ── */
    #help-menu {
      position: absolute;
      top: 48px;
      right: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 6px;
      min-width: 200px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
      animation: menuIn 0.15s ease;
    }

    #help-menu.visible { display: block; }

    @keyframes menuIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #help-menu a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
      border-radius: 6px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    #help-menu a:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    #help-menu a svg {
      width: 14px;
      height: 14px;
      opacity: 0.5;
      flex-shrink: 0;
    }

    #help-menu .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <!-- Title Bar -->
  <div id="titlebar">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="gem" x1="0" y1="0" x2="24" y2="24"><stop offset="0%" stop-color="#638cff"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs><path d="M12 2L22 12L12 22L2 12Z" fill="url(#gem)"/><path d="M12 2L17 7L12 12L7 7Z" fill="rgba(255,255,255,0.25)"/><path d="M12 12L17 7L22 12L17 17Z" fill="rgba(255,255,255,0.1)"/></svg></div>
    <span class="title">Clicky</span>
    <div class="status" id="status-dot"></div>
    <button class="gear-btn" id="pin-btn" title="Pin on top">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 01-1.11 1.79l-1.78.9A2 2 0 005 15.24V16a1 1 0 001 1h12a1 1 0 001-1v-.76a2 2 0 00-1.11-1.79l-1.78-.9A2 2 0 0115 10.76V7a1 1 0 011-1 1 1 0 001-1V4a1 1 0 00-1-1H8a1 1 0 00-1 1v1a1 1 0 001 1 1 1 0 011 1z"/></svg>
    </button>
    <button class="gear-btn" id="open-settings" title="Settings">

  <!-- Messages -->
  <div id="messages">
    <div class="welcome" id="welcome">

  <!-- Status Bar -->
  <div id="status-bar" class="status-bar hidden">
    <div class="status-dot-anim"></div>
    <span id="status-text"></span>
  </div>

  <!-- Input -->
  <div id="input-area">
    <button id="tts-toggle" class="tts-btn" title="Voice: Off">
      <svg id="tts-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      <span id="tts-label" style="font-size:9px;font-weight:600;letter-spacing:0.02em;margin-left:2px;"></span>
    </button>
    <input type="text" id="input" placeholder="Ask about your screen..." autofocus>
    <button id="mic-btn" class="mic-btn" title="Push to talk (or Ctrl+Alt+Space)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button id="send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <script>
    // Global error handler — shows errors visually
    window.onerror = function(msg, src, line, col, err) {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:10px;background:red;color:white;font-size:12px;z-index:99999;word-break:break-all;';
      el.textContent = 'JS Error: ' + msg + ' (line ' + line + ')';
      document.body.prepend(el);
    };

    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const welcome = document.getElementById('welcome');
    const statusDot = document.getElementById('status-dot');
    const openSettingsBtn = document.getElementById('open-settings');
    const setupCta = document.getElementById('setup-cta');
    const setupCtaBtn = document.getElementById('setup-cta-btn');

    // Provider label shown in the titlebar once configured. Model and key
    // configuration now live entirely in the settings window.
    const providerLabels = { anthropic: 'Claude', openai: 'OpenAI', openrouter: 'OpenRouter', gemini: 'Gemini', 'opencode-go': 'OpenCode Go' };
    let currentProvider = 'anthropic';

    let isConfigured = false;
    let firstMessage = true;

    // Load existing settings — chat only needs the configured/connected state
    // and the active provider label. All keys/models are configured in the
    // settings window now. (The theme is stamped pre-paint in <head> from the
    // ?theme= query param, then kept current by onThemeChanged below.)
    function refreshConfiguredState() {
      return window.clicky.getSettings().then((settings) => {
        currentProvider = settings.aiProvider || 'anthropic';
        const hasKey = settings.anthropicApiKey || settings.openaiApiKey || settings.openrouterApiKey || settings.geminiApiKey || settings.opencodeGoApiKey;
        setConfigured(!!hasKey);
      }).catch((err) => {
        console.error('Failed to load settings:', err);
        setConfigured(false);
      });
    }
    refreshConfiguredState();

    // Live theme updates broadcast from main (changed in the settings window).
    window.clicky.onThemeChanged(({ theme }) => window.clicky.applyTheme(theme));

    // Gear button + first-run CTA both open the single settings window.
    openSettingsBtn.addEventListener('click', () => window.clicky.openSettings());
    setupCtaBtn.addEventListener('click', () => window.clicky.openSettings());

    // When the chat window regains focus (e.g. after closing settings),
    // re-read whether a key has been configured.
    window.addEventListener('focus', () => { refreshConfiguredState(); });

    function setConfigured(configured) {
      isConfigured = configured;
      statusDot.className = configured ? 'status connected' : 'status';

      // Update titlebar to show active provider
      const providerLabel = providerLabels[currentProvider] || currentProvider;
      document.querySelector('#titlebar .title').textContent =
        configured ? 'Clicky · ' + providerLabel : 'Clicky';

      // Show the first-run "Set up Clicky" CTA only while unconfigured and
      // the welcome screen is still visible.
      if (setupCta) {
        setupCta.classList.toggle('hidden', configured || firstMessage === false);
      }

      if (configured) input.focus();
    }

    function addMessage(text, role) {
      if (firstMessage) {
        welcome.remove();
        firstMessage = false;
      }
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      if (role === 'assistant' && typeof marked !== 'undefined') {
        try {
          div.innerHTML = marked.parse(text, { breaks: true });
        } catch (e) {
          div.textContent = text;
        }
      } else {
        div.textContent = text;
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function addLoading() {
      if (firstMessage) {
        welcome.remove();
        firstMessage = false;
      }
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.id = 'loading-msg';
      div.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // ── Streaming response handling ──
    // The main process streams the assistant reply via chat:stream-* events:
    // stream-start opens a bubble, stream-delta appends plain text live (POINT
    // tags stripped), stream-end renders the final markdown. The invoke return
    // (sendQuery / sendAudioRecording) still resolves with the full text and is
    // used as a FALLBACK only when no streaming occurred (e.g. an early error).
    const POINT_RE = /\[POINT:[^\]]+\]/g;
    let streamBubble = null;
    let streamRaw = '';
    let streamProduced = false;

    // Remove complete POINT tags and hide any trailing incomplete tag that has
    // not closed yet (e.g. a response truncated at max tokens). Keeping the raw
    // text intact lets a later chunk finish the tag; stripping here only affects
    // what the user sees.
    function stripPointTags(text) {
      const withoutComplete = text.replace(POINT_RE, '');
      const trailingOpen = withoutComplete.match(/\[[^\]]*$/);
      if (trailingOpen && /\[POINT:/i.test(trailingOpen[0])) {
        return withoutComplete.slice(0, trailingOpen.index);
      }
      return withoutComplete;
    }

    function removeWelcome() {
      if (firstMessage) {
        welcome.remove();
        firstMessage = false;
      }
    }

    // Transcript arrives before the reply starts streaming — swap the
    // "(voice message)" placeholder as soon as it lands so the user sees what
    // was heard without waiting for the answer.
    if (window.clicky.onVoiceTranscript) {
      window.clicky.onVoiceTranscript((transcript) => {
        if (!transcript) return;
        const userMsgs = messages.querySelectorAll('.msg.user');
        const lastUser = userMsgs[userMsgs.length - 1];
        if (lastUser && lastUser.textContent === '(voice message)') {
          lastUser.textContent = transcript;
        }
      });
    }

    window.clicky.onStreamStart(() => {
      removeWelcome();
      document.getElementById('loading-msg')?.remove();
      // If a previous stream was superseded, its bubble is now orphaned —
      // remove it before creating the new one so partial replies don't stack.
      if (streamBubble) {
        streamBubble.remove();
      }
      streamRaw = '';
      streamProduced = true;
      streamBubble = document.createElement('div');
      streamBubble.className = 'msg assistant';
      messages.appendChild(streamBubble);
      messages.scrollTop = messages.scrollHeight;
      hideStatus();
    });

    window.clicky.onStreamDelta(({ text }) => {
      if (!streamBubble) return;
      streamRaw += text;
      // Plain text while streaming — cheap, flicker-free; markdown at the end.
      streamBubble.textContent = stripPointTags(streamRaw).trim();
      messages.scrollTop = messages.scrollHeight;
    });

    window.clicky.onStreamEnd(({ text, error }) => {
      const finalText = stripPointTags(text || streamRaw).trim();
      if (error) {
        // Drop the (usually empty) streaming bubble; the invoke catch shows the
        // error message as a single source of truth.
        if (streamBubble) streamBubble.remove();
      } else if (streamBubble) {
        if (finalText) {
          try {
            streamBubble.innerHTML = marked.parse(finalText, { breaks: true });
          } catch (e) {
            streamBubble.textContent = finalText;
          }
        } else {
          streamBubble.textContent = '(no response)';
        }
      }
      streamBubble = null;
      streamRaw = '';
      messages.scrollTop = messages.scrollHeight;
      hideStatus();
    });

    async function send() {
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      addMessage(text, 'user');
      streamProduced = false;
      addLoading();

      try {
        const response = await window.clicky.sendQuery(text);
        document.getElementById('loading-msg')?.remove();
        // If streaming already rendered the bubble, don't duplicate it.
        if (!streamProduced) {
          const displayText = stripPointTags(response || '').trim();
          addMessage(displayText || '(no response)', 'assistant');
        }
      } catch (err) {
        document.getElementById('loading-msg')?.remove();
        addMessage('Error: ' + (err.message || err), 'system');
      }

      hideStatus();
      input.focus();
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // ── Pin (always on top) toggle ──
    const pinBtn = document.getElementById('pin-btn');
    let isPinned = false;

    window.clicky.getSettings().then((s) => {
      isPinned = !!s.alwaysOnTop;
      pinBtn.style.color = isPinned ? 'var(--accent)' : '';
      pinBtn.title = isPinned ? 'Unpin from top' : 'Pin on top';
    });

    pinBtn.addEventListener('click', () => {
      isPinned = !isPinned;
      window.clicky.setSetting('alwaysOnTop', isPinned);
      pinBtn.style.color = isPinned ? 'var(--accent)' : '';
      pinBtn.title = isPinned ? 'Unpin from top' : 'Pin on top';
    });

    // ── Status bar ──
    const statusBar = document.getElementById('status-bar');
    const statusText = document.getElementById('status-text');

    function showStatus(text, state) {
      statusBar.className = 'status-bar ' + state;
      statusText.textContent = text;
    }

    function hideStatus() {
      statusBar.className = 'status-bar hidden';
    }

    // Stage events from companion pipeline drive status bar text
    if (window.clicky.onStage) {
      window.clicky.onStage(({ stage, label }) => {
        if (stage === 'done') {
          hideStatus();
        } else if (stage === 'speaking') {
          showStatus(label, 'speaking');
        } else {
          showStatus(label, 'thinking');
        }
      });
    }

    // ── Push-to-talk mic recording ──
    const micBtn = document.getElementById('mic-btn');
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let discardRecording = false;

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, sampleRate: 16000 }
        });

        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, {
          mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus'
            : 'audio/webm'
        });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          // Stop all tracks to release mic
          stream.getTracks().forEach(t => t.stop());

          // Cancelled via Escape — drop the audio, reset UI, send nothing.
          if (discardRecording) {
            discardRecording = false;
            audioChunks = [];
            hideStatus();
            micBtn.className = 'mic-btn';
            micBtn.title = 'Push to talk (or Ctrl+Shift+Space)';
            return;
          }

          if (audioChunks.length === 0) return;

          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const webmBuffer = await blob.arrayBuffer();

          // Decode webm/opus → raw PCM at 16 kHz mono Int16, so the
          // main process can write a WAV file for whisper.cpp without
          // shipping ffmpeg. Same buffer also works for OpenAI Whisper API.
          // Main assumes raw 16-bit PCM, so if decode fails we must surface
          // the error — sending webm would produce garbled audio.
          let arrayBuffer;
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const decoded = await audioCtx.decodeAudioData(webmBuffer.slice(0));
            const floatPCM = decoded.getChannelData(0);
            const int16PCM = new Int16Array(floatPCM.length);
            for (let i = 0; i < floatPCM.length; i++) {
              const s = Math.max(-1, Math.min(1, floatPCM[i]));
              int16PCM[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            arrayBuffer = int16PCM.buffer;
            audioCtx.close();
          } catch (decodeErr) {
            console.error('PCM decode failed:', decodeErr);
            addMessage('Voice error: could not decode audio (' + (decodeErr.message || decodeErr) + ')', 'system');
            hideStatus();
            micBtn.className = 'mic-btn';
            micBtn.title = 'Push to talk (or Ctrl+Shift+Space)';
            return;
          }

          // Show processing state
          micBtn.className = 'mic-btn processing';
          micBtn.title = 'Transcribing...';
          showStatus('Transcribing your voice...', 'thinking');

          addMessage('(voice message)', 'user');
          streamProduced = false;
          addLoading();

          try {
            const result = await window.clicky.sendAudioRecording(arrayBuffer);

            document.getElementById('loading-msg')?.remove();

            if (result.error) {
              addMessage('Voice error: ' + result.error, 'system');
              hideStatus();
            } else {
              // Replace the "(voice message)" with actual transcript
              const userMsgs = messages.querySelectorAll('.msg.user');
              const lastUser = userMsgs[userMsgs.length - 1];
              if (lastUser && lastUser.textContent === '(voice message)') {
                lastUser.textContent = result.transcript;
              }

              // The assistant reply streams in via chat:stream-* events; only
              // fall back to the returned text if no streaming occurred.
              if (!streamProduced && result.response) {
                const displayText = stripPointTags(result.response).trim();
                addMessage(displayText || '(no response)', 'assistant');
              }
            }
          } catch (err) {
            document.getElementById('loading-msg')?.remove();
            addMessage('Voice error: ' + (err.message || err), 'system');
          }

          hideStatus();
          micBtn.className = 'mic-btn';
          micBtn.title = 'Push to talk (or Ctrl+Shift+Space)';
        };

        mediaRecorder.start(250); // collect chunks every 250ms
        isRecording = true;
        micBtn.className = 'mic-btn recording';
        micBtn.title = 'Recording... click to stop';
        showStatus('Listening...', 'recording');

      } catch (err) {
        addMessage('Mic error: ' + (err.message || err), 'system');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
    }

    // Click mic button to toggle
    micBtn.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    // Global hotkey (Ctrl+Alt+Space) triggers from main process
    window.clicky.onRecordingChanged((recording) => {
      if (recording && !isRecording) {
        startRecording();
      } else if (!recording && isRecording) {
        stopRecording();
      }
    });

    // Escape during recording — abort and discard the audio.
    if (window.clicky.onRecordingCancelled) {
      window.clicky.onRecordingCancelled(() => {
        if (isRecording) {
          discardRecording = true;
          stopRecording();
        }
      });
    }

    // TTS 4-state toggle: off → Kokoro (offline neural) → Windows → OpenAI cloud → off
    const ttsToggle = document.getElementById('tts-toggle');
    const ttsIcon = document.getElementById('tts-icon');
    const ttsLabel = document.getElementById('tts-label');
    // States: 'off', 'kokoro', 'local', 'openai'
    let ttsState = 'off';

    // Load saved TTS state
    window.clicky.getSettings().then((s) => {
      if (!s.ttsEnabled) {
        ttsState = 'off';
      } else if (s.ttsProvider === 'openai') {
        ttsState = 'openai';
      } else if (s.ttsProvider === 'kokoro') {
        ttsState = 'kokoro';
      } else {
        ttsState = 'local';
      }
      updateTTSUI();
    });

    const ttsIconPaths = {
      off: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
      kokoro: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/>',
      local: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/>',
      openai: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/>',
    };

    function updateTTSUI() {
      ttsIcon.innerHTML = ttsIconPaths[ttsState];
      const offline = ttsState === 'kokoro' || ttsState === 'local';
      ttsToggle.className = 'tts-btn' + (offline ? ' active-local' : ttsState === 'openai' ? ' active-cloud' : '');

      if (ttsState === 'off') {
        ttsLabel.textContent = '';
        ttsToggle.title = 'Voice off — click for Kokoro (offline) voice';
      } else if (ttsState === 'kokoro') {
        ttsLabel.textContent = 'Kokoro';
        ttsToggle.title = 'Kokoro voice (offline) — click for Windows voice';
      } else if (ttsState === 'local') {
        ttsLabel.textContent = 'Windows';
        ttsToggle.title = 'Windows voice — click for OpenAI voice';
      } else {
        ttsLabel.textContent = 'OpenAI';
        ttsToggle.title = 'OpenAI voice — click to turn off';
      }
    }

    ttsToggle.addEventListener('click', () => {
      if (ttsState === 'off') {
        ttsState = 'kokoro';
        window.clicky.setSetting('ttsEnabled', true);
        window.clicky.setSetting('ttsProvider', 'kokoro');
      } else if (ttsState === 'kokoro') {
        ttsState = 'local';
        window.clicky.setSetting('ttsEnabled', true);
        window.clicky.setSetting('ttsProvider', 'local');
      } else if (ttsState === 'local') {
        ttsState = 'openai';
        window.clicky.setSetting('ttsEnabled', true);
        window.clicky.setSetting('ttsProvider', 'openai');
      } else {
        ttsState = 'off';
        window.clicky.setSetting('ttsEnabled', false);
      }
      updateTTSUI();
    });

    // Window controls
    document.getElementById('btn-minimize').addEventListener('click', () => {
      window.clicky.minimizeWindow();
    });
    document.getElementById('btn-close').addEventListener('click', () => {
      window.clicky.closeWindow();
    });

    // Help menu
    const helpBtn = document.getElementById('help-btn');
    const helpMenu = document.getElementById('help-menu');

    helpBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      helpMenu.classList.toggle('visible');
    });

    document.addEventListener('click', () => {
      helpMenu.classList.remove('visible');
    });

    helpMenu.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // Open all data-href links in default browser
    document.querySelectorAll('[data-href]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const url = el.getAttribute('data-href');
        if (url) window.clicky.openExternal(url);
        helpMenu.classList.remove('visible');
      });
    });
  </script>
</body>
</html>
